name: meta-ads-mcp-server CI

on:
  push:
    branches: [main, master]
    paths:
      - 'meta-ads-mcp-server/**'
      - '.github/workflows/meta-ads-mcp-server-ci.yml'
  pull_request:
    paths:
      - 'meta-ads-mcp-server/**'
      - '.github/workflows/meta-ads-mcp-server-ci.yml'

defaults:
  run:
    working-directory: meta-ads-mcp-server

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: meta-ads-mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t meta-ads-mcp-server:ci .
