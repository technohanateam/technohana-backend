# Default `docker compose up` runs just the app, using the default
# STORAGE_BACKEND=file / CACHE_BACKEND=memory (see .env.example) - no other
# services required.
#
# To run against Redis/Mongo/Postgres instead, activate the matching profile
# AND point the app at it via your .env (STORAGE_BACKEND=redis, etc.):
#   docker compose --profile redis up
#   docker compose --profile mongo up
#   docker compose --profile postgres up
#   docker compose --profile full up      # all three backends available at once

services:
  app:
    build: .
    ports:
      - '${PORT:-3333}:3333'
    env_file:
      - .env
    volumes:
      - app-data:/app/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: ['redis', 'full']

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ['mongo', 'full']

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meta_ads_mcp
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: ['postgres', 'full']

volumes:
  app-data:
  redis-data:
  mongo-data:
  postgres-data:
